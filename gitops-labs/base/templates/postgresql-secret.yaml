{{- if has "postgresql" .Values.apps }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ .Values.nombre }}
type: Opaque
stringData:
  # In a real environment, this should probably be generated or more secure.
  # For labs, a fixed password or user-provided one is acceptable.
  postgres-password: "changeme"
{{- end }}
